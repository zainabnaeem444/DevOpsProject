apiVersion: v1
kind: Service
metadata:
  name: receiver-service
  namespace: ecometrics
  labels:
    app: receiver
spec:
  type: NodePort
  selector:
    app: receiver
  ports:
  - name: http
    protocol: TCP
    port: 5000
    targetPort: 5000
    nodePort: 30500
  - name: socket
    protocol: TCP
    port: 65432
    targetPort: 65432